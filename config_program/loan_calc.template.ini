# ============================================================
# Loan Calculator -- CONFIG TEMPLATE
#
# HOW TO USE (the dynamic-input flow):
#   1. Download this file from the Jenkins build screen.
#   2. Edit the values below to YOUR own inputs.
#   3. Upload it back in the Jenkins build screen, then Build.
#
# The values below are EXAMPLES only -- the build runs with
# whatever YOU upload, not these defaults.
#
# WHAT YOU GET BACK:
#   The program calculates your monthly EMI and, importantly,
#   the EXTRA amount you pay on top of the loan (the interest).
#   Example: borrow 100000 -> you may repay ~125000 total,
#   so the EXTRA you pay (besides the 100000) is ~25000.
# ============================================================

[loan]
# principal   = the loan amount you borrow, in your currency (e.g. 100000 = 1 lakh)
principal = 100000

# annual_rate = yearly interest rate in PERCENT (e.g. 9.5 means 9.5% per year)
annual_rate = 9.5

# years       = loan duration in YEARS, whole number (e.g. 5 = five years / 60 months)
years = 5
